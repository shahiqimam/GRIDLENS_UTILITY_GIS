services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: gridlens-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-gridlens}
      POSTGRES_USER: ${DATABASE_USER:-gridlens}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-gridlens_dev_password}
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: gridlens-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

